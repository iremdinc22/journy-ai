spring:
  application:
    name: backend
  profiles:
    default: dev
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET:journy-local-development-secret-change-before-production}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    refresh-token-expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
  ai-agent:
    base-url: ${AI_AGENT_BASE_URL:http://localhost:8001}

journy:
  weather:
    open-meteo:
      enabled: ${OPEN_METEO_ENABLED:true}
      endpoint: ${OPEN_METEO_ENDPOINT:https://api.open-meteo.com/v1/forecast}
